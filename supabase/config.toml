project_id = "flatmeal"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# Expo serves the web build on 8081, not CRA's 3000. This is the fallback
# Supabase redirects to when an OAuth redirect_to isn't allow-listed below —
# a wrong value here shows up as a confusing "site can't be reached" at the
# end of an otherwise-successful sign-in.
site_url = "http://localhost:8081"
# OAuth (Google/Apple) redirect targets. `salted://` is the app's scheme
# (app.json) used by dev/production builds; the `exp://` entries are Expo
# Go, which owns the scheme itself and serves over the LAN — the IP changes
# with the network, hence the wildcard alongside the current address.
additional_redirect_urls = [
  "salted://",
  "salted://*",
  "exp://192.168.1.19:8081",
  "exp://192.168.1.19:8081/--/*",
  "http://localhost:8081",
  "http://localhost:8081/reset-password",
  "salted://reset-password",
  "exp://127.0.0.1:8081/--/reset-password",
  "exp://10.0.2.2:8081/--/reset-password",
]
jwt_expiry = 3600
enable_signup = true

[auth.sms]
enable_signup = true
enable_confirmations = false

[edge_runtime]
enabled = true

[functions.create_poll]
verify_jwt = false

[functions.close_poll]
verify_jwt = false

[functions.dispatch_cook]
verify_jwt = false

[functions.wa_webhook]
verify_jwt = false

[functions.password_login]
verify_jwt = false
